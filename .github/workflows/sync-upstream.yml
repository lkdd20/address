name: Sync upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream while preserving fork workflows
        env:
          UPSTREAM_REPOSITORY: daimon3332/address
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'Fork main already contains the latest upstream commit.'
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff upstream/main
          merge_status=$?
          set -e

          if [[ ! -f .git/MERGE_HEAD ]]; then
            echo "Unable to start the upstream merge (status ${merge_status})." >&2
            exit "${merge_status}"
          fi

          # GITHUB_TOKEN cannot modify workflow files in a fork. Keep this
          # fork's workflows and sync every other upstream file normally.
          git rm -r -f --ignore-unmatch .github/workflows >/dev/null 2>&1 || true
          git checkout HEAD -- .github/workflows
          git add -A

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "${unresolved}" ]]; then
            echo 'Upstream has non-workflow conflicts that require review:' >&2
            printf '%s\n' "${unresolved}" >&2
            git merge --abort
            exit 1
          fi

          git commit -m 'chore: sync upstream (preserve fork workflows)'
          git push origin HEAD:main
